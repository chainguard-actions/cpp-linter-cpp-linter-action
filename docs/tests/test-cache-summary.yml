name: Test cache-enable and summary-output-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a well-formatted C++ file
        run: |
          mkdir -p tests/fixtures/cache-summary
          cat > tests/fixtures/cache-summary/hello.cpp << 'EOF'
          #include <cstdio>

          int main()
          {
              printf("Hello, world!\n");
              return 0;
          }
          EOF

      - id: action
        uses: .
        with:
          style: 'llvm'
          extensions: 'cpp'
          tidy-checks: '-*'
          files-changed-only: 'false'
          lines-changed-only: 'false'
          ignore: 'tests/fixtures/cache-summary'
          file-annotations: 'false'
          thread-comments: 'false'
          step-summary: 'false'
          cache-enable: 'false'
          summary-output-file: '/tmp/cpp-linter-summary.md'
        continue-on-error: true

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHECKS_FAILED" ]; then
              echo "FAIL: action succeeded but checks-failed output is empty"
              exit 1
            fi
            echo "PASS: action produced checks-failed output: $CHECKS_FAILED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs section - docs-only metadata)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test verbosity and jobs inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: lint
        uses: .
        continue-on-error: true
        with:
          style: "file"
          extensions: "cpp,hpp"
          tidy-checks: ""
          repo-root: "."
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "false"
          step-summary: "false"
          thread-comments: "false"
          verbosity: "10"
          jobs: "1"

      - name: Assert action ran with verbosity and jobs inputs
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          CHECKS_FAILED: ${{ steps.lint.outputs.checks-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with verbosity and jobs inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs: section in this metadata repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test clang-tidy only (no format)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cpp-linter
        run: pip install cpp-linter

      - name: Create C++ file with tidy issues
        run: |
          mkdir -p /tmp/cpp-tidy
          cat > /tmp/cpp-tidy/tidy_test.cpp << 'EOF'
          #include <stdio.h>
          int main() {
              printf("Hello world!\n");
              return 0;
          }
          EOF
          cat > /tmp/cpp-tidy/.clang-tidy << 'EOF'
          ---
          Checks: 'clang-diagnostic-*,clang-analyzer-*'
          WarningsAsErrors: ''
          HeaderFilterRegex: ''
          FormatStyle: 'none'
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          style: ""
          tidy-checks: "clang-diagnostic-*,clang-analyzer-*"
          extensions: "cpp"
          repo-root: "/tmp/cpp-tidy"
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "false"
          step-summary: "false"
          thread-comments: "false"

      - name: Assert action ran (tidy checks or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -z "$CHECKS_FAILED" ]; then
              echo "FAIL: checks-failed output is empty"
              exit 1
            fi
            echo "PASS: got checks-failed='$CHECKS_FAILED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs: section — expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

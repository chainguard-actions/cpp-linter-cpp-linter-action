name: Test cpp-linter with step summary enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a C++ file with intentional formatting issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          cat > "$GITHUB_WORKSPACE/src/bad_format.cpp" << 'EOF'
          #include<iostream>
          int main(){std::cout<<"Hello"<<std::endl;return 0;}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          style: "google"
          extensions: "cpp"
          tidy-checks: "-*"
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "true"
          step-summary: "true"
          thread-comments: "false"

      - name: Assert action ran and format checks detected issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHECKS_FAILED" ]; then
              echo "FAIL: checks-failed output is empty"
              exit 1
            fi
            echo "PASS: action succeeded, checks-failed=$CHECKS_FAILED format-failed=$FORMAT_FAILED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test outputs are documented with versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # docs/action.yml is a documentation metadata file (no `runs:` section).
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert step was attempted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          case "$OUTCOME" in
            success|failure) echo "PASS: step ran (outcome $OUTCOME)";;
            *) echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1;;
          esac
      - name: Locate metadata file
        run: |
          F=""
          for c in "$GITHUB_WORKSPACE/action.yml" "$GITHUB_WORKSPACE/docs/action.yml"; do
            if [ -f "$c" ] && grep -q 'minimum-version' "$c"; then F="$c"; break; fi
          done
          if [ -z "$F" ]; then
            F="$(grep -rl --include=action.yml 'minimum-version' "$GITHUB_WORKSPACE" 2>/dev/null | head -n1)"
          fi
          if [ -z "$F" ]; then echo "FAIL: metadata action.yml not found"; exit 1; fi
          echo "metadata: $F"
          awk '
            /^[A-Za-z]/ { sec=$1; sub(/:.*$/,"",sec); next }
            /^  [A-Za-z0-9_-]+:/ { key=$1; sub(/:$/,"",key); print sec, key, "_entry", "-"; next }
            /^    [a-z-]+:/ { prop=$1; sub(/:$/,"",prop); $1=""; v=$0; sub(/^ +/,"",v); gsub(/\047/,"",v); print sec, key, prop, v }
          ' "$F" > /tmp/meta.txt
          cat /tmp/meta.txt
      - name: Assert the three outputs are documented with versions
        run: |
          for o in checks-failed clang-tidy-checks-failed clang-format-checks-failed; do
            V=$(awk -v k="$o" '$1=="outputs" && $2==k && $3=="minimum-version" {print $4}' /tmp/meta.txt)
            echo "$o -> $V"
            if [ -z "$V" ]; then echo "FAIL: output '$o' missing or has no minimum-version"; exit 1; fi
          done
          V=$(awk '$1=="outputs" && $2=="checks-failed" && $3=="minimum-version" {print $4}' /tmp/meta.txt)
          if [ "$V" != "1.2.0" ]; then echo "FAIL: expected checks-failed minimum-version 1.2.0, got '$V'"; exit 1; fi
          V=$(awk '$1=="outputs" && $2=="clang-format-checks-failed" && $3=="minimum-version" {print $4}' /tmp/meta.txt)
          if [ "$V" != "2.7.2" ]; then echo "FAIL: expected clang-format-checks-failed minimum-version 2.7.2, got '$V'"; exit 1; fi
          echo "PASS"

name: Test advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          thread-comments: "false"
          no-lgtm: "true"
          step-summary: "false"
          file-annotations: "true"
          database: ""
          extra-args: ""
          tidy-review: "false"
          format-review: "false"
          passive-reviews: "false"
          jobs: "1"
          cache-enable: "true"
      - name: Assert action ran (no runs section — graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

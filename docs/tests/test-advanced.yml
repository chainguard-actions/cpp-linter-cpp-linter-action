name: Test advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          database: ''
          extra-args: '--extra-arg=-std=c++17'
          tidy-review: 'false'
          format-review: 'false'
          passive-reviews: 'false'
          jobs: '1'
          cache-enable: 'true'
      - name: Assert action ran (outputs set, or failed gracefully on missing runs section)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected for documentation-only action.yml)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

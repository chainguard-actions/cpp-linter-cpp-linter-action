name: Test ignore input (skip specific files)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cpp-linter
        run: pip install cpp-linter

      - name: Create C++ files (one to ignore, one to check)
        run: |
          mkdir -p /tmp/cpp-ignore/vendor
          # Badly formatted file in vendor/ (should be ignored)
          cat > /tmp/cpp-ignore/vendor/third_party.cpp << 'EOF'
          #include <stdio.h>
          int main(){printf("Hello world!\n");return 0;}
          EOF
          # Well-formatted file in root (should be checked)
          cat > /tmp/cpp-ignore/main.cpp << 'EOF'
          #include <cstdio>

          int main()
          {
              printf("Hello, world!\n");
              return 0;
          }
          EOF
          cat > /tmp/cpp-ignore/.clang-format << 'EOF'
          ---
          Language:        Cpp
          BasedOnStyle:  WebKit
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          style: "file"
          tidy-checks: "-*"
          extensions: "cpp"
          repo-root: "/tmp/cpp-ignore"
          ignore: "vendor"
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "false"
          step-summary: "false"
          thread-comments: "false"

      - name: Assert action ran (ignored vendor dir or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -z "$CHECKS_FAILED" ]; then
              echo "FAIL: checks-failed output is empty"
              exit 1
            fi
            # vendor/ is ignored, so only main.cpp is checked — should be 0 failures
            echo "PASS: got checks-failed='$CHECKS_FAILED' (vendor/ ignored)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs: section — expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test ignore input - skip files from linting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: lint
        uses: .
        with:
          style: "llvm"
          extensions: "cpp"
          tidy-checks: "-*"
          repo-root: "tests/fixtures/cpp"
          # Ignore the badly formatted file so checks should pass
          ignore: "tests/fixtures/cpp/bad_format.cpp"
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "false"
          thread-comments: "false"
          step-summary: "false"
        continue-on-error: true

      - name: Assert action ran with ignore input
        env:
          CHECKS_FAILED: ${{ steps.lint.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.lint.outputs.clang-format-checks-failed }}
          TIDY_FAILED: ${{ steps.lint.outputs.clang-tidy-checks-failed }}
          OUTCOME: ${{ steps.lint.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ignore input (bad_format.cpp was ignored)"
            echo "checks-failed=$CHECKS_FAILED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to sentinel repo or other issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

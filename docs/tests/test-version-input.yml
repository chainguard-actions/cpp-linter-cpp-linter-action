name: Test version input for clang tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: lint
        uses: .
        continue-on-error: true
        with:
          version: "16"
          style: "file"
          extensions: "cpp,hpp"
          tidy-checks: "-*"
          repo-root: "."
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "false"
          step-summary: "false"
          thread-comments: "false"

      - name: Assert version-pinned run (outputs set or failed gracefully)
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          CHECKS_FAILED: ${{ steps.lint.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.lint.outputs.clang-format-checks-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version=16"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs: section in this metadata repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

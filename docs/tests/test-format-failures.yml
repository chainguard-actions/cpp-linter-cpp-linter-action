name: Test clang-format detects formatting issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a poorly-formatted C++ file
        run: |
          mkdir -p tests/fixtures/bad-format
          cat > tests/fixtures/bad-format/ugly.cpp << 'EOF'
          #include<stdio.h>
          int main(){printf("Hello world!\n");return 0;}
          EOF

      - id: action
        uses: .
        with:
          style: 'llvm'
          extensions: 'cpp'
          tidy-checks: '-*'
          files-changed-only: 'false'
          lines-changed-only: 'false'
          ignore: ''
          file-annotations: 'false'
          thread-comments: 'false'
          step-summary: 'false'
        continue-on-error: true

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHECKS_FAILED" ] && [ -z "$FORMAT_FAILED" ]; then
              echo "FAIL: action succeeded but no output produced"
              exit 1
            fi
            echo "PASS: action ran and produced output (format failures detected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs section - docs-only metadata)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

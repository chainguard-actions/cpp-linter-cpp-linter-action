name: Test core inputs metadata (docs action.yml)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The "action" under test is the docs metadata file (inputs/outputs with
      # minimum-version), not a runnable action. We pass every core input and
      # record the outcome only; then validate the metadata itself.
      - id: action
        uses: .
        continue-on-error: true
        with:
          style: file
          extensions: c,h,cpp,hpp
          tidy-checks: 'boost-*,bugprone-*'
          repo-root: .
          version: '18'
          verbosity: info
          lines-changed-only: 'false'
          files-changed-only: 'false'
          ignore: '.github|build'
          ignore-tidy: 'third_party'
          ignore-format: 'generated'
          thread-comments: 'false'
          no-lgtm: 'true'
          step-summary: 'true'
          file-annotations: 'true'
          database: build
          extra-args: '-std=c++17 -Wall'
          jobs: '2'
          cache-enable: 'true'
          summary-output-file: summary.md
      - name: Assert step outcome is a definite result
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: outcome '$OUTCOME'"
      - name: Assert core inputs metadata
        run: |
          META=""
          for c in "$GITHUB_WORKSPACE/docs/action.yml" "$GITHUB_WORKSPACE/action.yml"; do
            if [ -f "$c" ] && grep -q 'minimum-version' "$c"; then META="$c"; break; fi
          done
          if [ -z "$META" ]; then echo "FAIL: metadata action.yml not found"; exit 1; fi
          echo "metadata file: $META"
          get_field() {
            awk -v s="$1" -v k="$2" -v f="$3" '
              /^[^ #]/ { cur=$0; sub(/:.*/,"",cur); inkey=0; next }
              cur==s && /^  [^ ]/ { name=$0; sub(/^  /,"",name); sub(/:.*/,"",name); inkey=(name==k); next }
              cur==s && inkey && /^    [^ ]/ { line=$0; sub(/^    /,"",line); n=line; sub(/:.*/,"",n);
                if (n==f) { v=line; sub(/^[^:]*:[ ]*/,"",v); print v; exit } }
            ' "$META" | tr -d "'\""
          }
          check() {
            actual="$(get_field "$1" "$2" "$3")"
            echo "$1.$2.$3 = '$actual'"
            if [ "$actual" != "$4" ]; then
              echo "FAIL: expected '$4'"
              exit 1
            fi
          }
          check inputs style minimum-version 1.2.0
          check inputs extensions minimum-version 1.2.0
          check inputs tidy-checks minimum-version 1.2.0
          check inputs repo-root minimum-version 1.2.0
          check inputs version minimum-version 1.2.0
          check inputs verbosity minimum-version 1.3.0
          check inputs lines-changed-only minimum-version 1.5.0
          check inputs files-changed-only minimum-version 1.3.0
          check inputs ignore minimum-version 1.3.0
          check inputs ignore-tidy minimum-version 2.12.0
          check inputs ignore-format minimum-version 2.12.0
          check inputs thread-comments minimum-version 2.6.2
          check inputs no-lgtm minimum-version 2.6.2
          check inputs step-summary minimum-version 2.6.0
          check inputs file-annotations minimum-version 1.4.3
          check inputs database minimum-version 1.4.0
          check inputs extra-args minimum-version 2.1.0
          check inputs jobs minimum-version 2.11.0
          check inputs cache-enable minimum-version 2.16.0
          check inputs summary-output-file minimum-version 2.20.0
          echo "PASS"

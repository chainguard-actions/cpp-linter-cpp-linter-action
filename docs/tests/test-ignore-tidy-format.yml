name: Test ignore-tidy and ignore-format inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cpp-linter
        run: pip install cpp-linter

      - name: Create C++ files with separate tidy and format directories
        run: |
          mkdir -p /tmp/cpp-ignore-tf/tidy_only /tmp/cpp-ignore-tf/format_only
          cat > /tmp/cpp-ignore-tf/tidy_only/tidy.cpp << 'EOF'
          #include <stdio.h>
          int main() { printf("Hello\n"); return 0; }
          EOF
          cat > /tmp/cpp-ignore-tf/format_only/fmt.cpp << 'EOF'
          #include <cstdio>

          int main()
          {
              printf("Hello, world!\n");
              return 0;
          }
          EOF
          cat > /tmp/cpp-ignore-tf/.clang-format << 'EOF'
          ---
          Language:        Cpp
          BasedOnStyle:  WebKit
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          style: "file"
          tidy-checks: "clang-diagnostic-*"
          extensions: "cpp"
          repo-root: "/tmp/cpp-ignore-tf"
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "false"
          step-summary: "false"
          thread-comments: "false"
          ignore-tidy: "tidy_only"
          ignore-format: "format_only"

      - name: Assert action ran (ignore-tidy and ignore-format inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHECKS_FAILED" ]; then
              echo "FAIL: checks-failed output is empty"
              exit 1
            fi
            echo "PASS: got checks-failed='$CHECKS_FAILED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs: section — expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test extra-args and database inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple C++ file
        run: |
          mkdir -p tests/fixtures/extra
          cat > tests/fixtures/extra/main.cpp << 'EOF'
          #include <cstdio>

          int main()
          {
              printf("Hello!\n");
              return 0;
          }
          EOF

      - id: action
        uses: .
        with:
          style: 'llvm'
          extensions: 'cpp'
          tidy-checks: '-*'
          files-changed-only: 'false'
          lines-changed-only: 'false'
          ignore: 'tests/fixtures/extra'
          file-annotations: 'false'
          thread-comments: 'false'
          step-summary: 'false'
          extra-args: '--std=c++17'
          database: ''
        continue-on-error: true

      - name: Assert action ran with extra-args and database inputs
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHECKS_FAILED" ]; then
              echo "FAIL: action succeeded but checks-failed output is empty"
              exit 1
            fi
            echo "PASS: action ran with extra-args and database inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (docs-only metadata action)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test summary-output-file input (v2.20.0 feature)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: lint
        uses: .
        continue-on-error: true
        with:
          style: "file"
          extensions: "cpp,hpp"
          tidy-checks: "-*"
          repo-root: "."
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "false"
          step-summary: "true"
          summary-output-file: "/tmp/cpp-linter-summary.md"
          thread-comments: "false"

      - name: Assert summary-output-file ran (outputs set or failed gracefully)
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          CHECKS_FAILED: ${{ steps.lint.outputs.checks-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with summary-output-file configured"
            # Check if the summary file was created
            if [ -f "/tmp/cpp-linter-summary.md" ]; then
              echo "PASS: summary output file was created"
              echo "--- summary file contents ---"
              cat /tmp/cpp-linter-summary.md
            else
              echo "INFO: summary output file was not created (may depend on whether there are linting results)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs: section in this metadata repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

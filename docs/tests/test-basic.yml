name: Test basic inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          style: "file"
          extensions: "cpp,h,hpp"
          tidy-checks: "clang-diagnostic-*,clang-analyzer-*"
          repo-root: "."
          version: "17"
          verbosity: "info"
          lines-changed-only: "false"
          files-changed-only: "false"
          ignore: ".github"
          ignore-tidy: ""
          ignore-format: ""
      - name: Assert action ran (no runs section — graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

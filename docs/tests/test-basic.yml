name: Test basic cpp-linter usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: lint
        uses: .
        continue-on-error: true
        with:
          style: "file"
          extensions: "cpp,hpp"
          tidy-checks: ""
          repo-root: "."
          files-changed-only: "false"
          lines-changed-only: "false"
          file-annotations: "true"
          step-summary: "false"
          thread-comments: "false"

      - name: Assert action ran (outputs set or failed gracefully)
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          CHECKS_FAILED: ${{ steps.lint.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.lint.outputs.clang-format-checks-failed }}
          TIDY_FAILED: ${{ steps.lint.outputs.clang-tidy-checks-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            # checks-failed should be a number (0 or more)
            if [ -n "$CHECKS_FAILED" ]; then
              echo "PASS: checks-failed output is set to '$CHECKS_FAILED'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (action.yml has no runs: section in this metadata repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

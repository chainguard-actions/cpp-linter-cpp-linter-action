name: Test step-summary output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare summary output file path
        run: |
          echo "SUMMARY_FILE=/tmp/cpp-linter-summary.md" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          # Disable clang-tidy to speed up the test
          tidy-checks: '-*'
          # Use llvm style for clang-format
          style: 'llvm'
          # Only check C files
          extensions: 'c'
          # Analyze all files (not just changed ones) to avoid GitHub API calls
          files-changed-only: 'false'
          lines-changed-only: 'false'
          # Disable thread comments (requires special permissions)
          thread-comments: 'false'
          # Disable PR reviews
          tidy-review: 'false'
          format-review: 'false'
          # Use version 18 (widely available)
          version: '18'
          # Enable step summary
          step-summary: 'true'
          # Write summary to a file
          summary-output-file: '/tmp/cpp-linter-summary.md'
          # Disable file annotations
          file-annotations: 'false'
        continue-on-error: true

      - name: Assert action ran and summary file exists (if action succeeded)
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or install issue)"
            exit 0
          fi

          # If action succeeded, outputs should be numeric
          if [ -z "$CHECKS_FAILED" ]; then
            echo "FAIL: checks-failed output is empty"
            exit 1
          fi

          # Check if summary file was written
          if [ -f "/tmp/cpp-linter-summary.md" ]; then
            echo "PASS: summary file was written"
            echo "--- Summary file contents ---"
            cat /tmp/cpp-linter-summary.md
          else
            echo "NOTE: summary file not found at /tmp/cpp-linter-summary.md (may be expected if no files were linted)"
          fi

          echo "PASS: action completed with checks-failed=$CHECKS_FAILED"

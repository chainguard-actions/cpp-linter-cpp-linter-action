name: Test step-summary and summary-output-file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Disable both tools to focus on summary output behavior
          tidy-checks: '-*'
          style: ''
          extensions: 'c,h,cpp,hpp'
          repo-root: '.'
          version: '20'
          verbosity: 'info'
          lines-changed-only: 'false'
          files-changed-only: 'false'
          ignore: '.github'
          thread-comments: 'false'
          no-lgtm: 'true'
          step-summary: 'true'
          file-annotations: 'false'
          cache-enable: 'false'
          summary-output-file: 'cpp-linter-summary.md'

      - name: Assert checks-failed output is a number
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
        run: |
          echo "checks-failed: $CHECKS_FAILED"
          if ! echo "$CHECKS_FAILED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected checks-failed to be a non-negative integer, got: '$CHECKS_FAILED'"
            exit 1
          fi
          echo "PASS: checks-failed=$CHECKS_FAILED"

      - name: Assert summary output file was created
        run: |
          if [ ! -f "cpp-linter-summary.md" ]; then
            echo "FAIL: expected summary output file 'cpp-linter-summary.md' to exist"
            exit 1
          fi
          echo "PASS: summary output file exists"
          echo "--- Summary file contents ---"
          cat cpp-linter-summary.md

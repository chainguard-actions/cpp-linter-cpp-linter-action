name: Test with both clang-tidy and clang-format disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Disable clang-tidy entirely
          tidy-checks: '-*'
          # Disable clang-format entirely
          style: ''
          extensions: 'c,cpp'
          files-changed-only: 'false'
          lines-changed-only: 'false'
          repo-root: '.'
          # Disable PR features
          thread-comments: 'false'
          tidy-review: 'false'
          format-review: 'false'
          file-annotations: 'false'
          step-summary: 'false'
          version: '20'

      - name: Assert outputs are zero when both tools disabled
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
        run: |
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          # When both tools are disabled, all outputs should be 0
          if [ "$CHECKS_FAILED" != "0" ]; then
            echo "FAIL: expected checks-failed=0, got '$CHECKS_FAILED'"
            exit 1
          fi
          if [ "$TIDY_FAILED" != "0" ]; then
            echo "FAIL: expected clang-tidy-checks-failed=0, got '$TIDY_FAILED'"
            exit 1
          fi
          if [ "$FORMAT_FAILED" != "0" ]; then
            echo "FAIL: expected clang-format-checks-failed=0, got '$FORMAT_FAILED'"
            exit 1
          fi
          echo "PASS: all outputs are 0 as expected when both tools are disabled"

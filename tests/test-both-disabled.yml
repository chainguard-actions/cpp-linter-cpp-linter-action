name: Test with both linters disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Disable clang-format entirely
          style: ''
          # Disable clang-tidy entirely
          tidy-checks: '-*'
          extensions: 'c,cpp'
          files-changed-only: 'false'
          lines-changed-only: 'false'
          repo-root: '.'
          ignore: '.github'
          ignore-tidy: '.github'
          ignore-format: '.github'
          thread-comments: 'false'
          tidy-review: 'false'
          format-review: 'false'
          step-summary: 'false'
          file-annotations: 'false'
          version: '20'
          verbosity: 'info'

      - name: Assert all checks-failed outputs are 0
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
        run: |
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          # Both linters are disabled, so all failure counts should be 0
          if [ "$TIDY_FAILED" != "0" ]; then
            echo "FAIL: expected clang-tidy-checks-failed=0 (tidy disabled), got: $TIDY_FAILED"
            exit 1
          fi
          if [ "$FORMAT_FAILED" != "0" ]; then
            echo "FAIL: expected clang-format-checks-failed=0 (format disabled), got: $FORMAT_FAILED"
            exit 1
          fi
          if [ "$CHECKS_FAILED" != "0" ]; then
            echo "FAIL: expected checks-failed=0 (both disabled), got: $CHECKS_FAILED"
            exit 1
          fi
          echo "PASS: all failure counts are 0 as expected when both linters are disabled"

name: Test both linters disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a C file
        run: |
          mkdir -p /tmp/test-disabled
          cat > /tmp/test-disabled/main.c << 'EOF'
          #include <stdio.h>
          int main(void) {
            printf("Hello\n");
            return 0;
          }
          EOF

      - id: action
        uses: .
        with:
          style: ''
          extensions: 'c'
          tidy-checks: '-*'
          repo-root: '/tmp/test-disabled'
          version: '18'
          verbosity: 'info'
          lines-changed-only: 'false'
          files-changed-only: 'false'
          ignore: ''
          thread-comments: 'false'
          no-lgtm: 'true'
          step-summary: 'false'
          file-annotations: 'false'
        continue-on-error: true

      - name: Assert both-disabled outputs
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            # Both disabled: both outputs should be 0
            if [ "$FORMAT_FAILED" != "0" ]; then
              echo "FAIL: expected clang-format-checks-failed=0 (format disabled), got '$FORMAT_FAILED'"
              exit 1
            fi
            if [ "$TIDY_FAILED" != "0" ]; then
              echo "FAIL: expected clang-tidy-checks-failed=0 (tidy disabled), got '$TIDY_FAILED'"
              exit 1
            fi
            if [ "$CHECKS_FAILED" != "0" ]; then
              echo "FAIL: expected checks-failed=0 (both disabled), got '$CHECKS_FAILED'"
              exit 1
            fi
            echo "PASS: both linters disabled, all outputs are 0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or tool install issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

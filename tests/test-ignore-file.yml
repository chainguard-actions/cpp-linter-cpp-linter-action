name: Test ignore input skips files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          style: llvm
          tidy-checks: '-*'
          repo-root: tests/fixtures/bad
          ignore: 'bad.cpp'
          files-changed-only: 'false'
          thread-comments: 'false'
      - name: Assert ignored file produced no failures
        env:
          ALL: ${{ steps.action.outputs.checks-failed }}
          FMT: ${{ steps.action.outputs.clang-format-checks-failed }}
        run: |
          echo "checks-failed: $ALL"
          echo "clang-format-checks-failed: $FMT"
          if [ "$FMT" != "0" ] || [ "$ALL" != "0" ]; then
            echo "FAIL: expected 0 failures when the only bad file is ignored"
            exit 1
          fi
          echo "PASS"

name: Test summary-output-file writes a summary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          style: llvm
          tidy-checks: '-*'
          repo-root: tests/fixtures/bad
          files-changed-only: 'false'
          thread-comments: 'false'
          summary-output-file: cpp-linter-summary.md
      - name: Assert summary file written
        env:
          FMT: ${{ steps.action.outputs.clang-format-checks-failed }}
        run: |
          F="$GITHUB_WORKSPACE/tests/fixtures/bad/cpp-linter-summary.md"
          echo "clang-format-checks-failed: $FMT"
          if [ ! -s "$F" ]; then
            echo "FAIL: summary file $F missing or empty"
            ls -la "$GITHUB_WORKSPACE/tests/fixtures/bad" || true
            exit 1
          fi
          cat "$F"
          if ! grep -q "bad.cpp" "$F"; then
            echo "FAIL: summary does not mention bad.cpp"
            exit 1
          fi
          echo "PASS"

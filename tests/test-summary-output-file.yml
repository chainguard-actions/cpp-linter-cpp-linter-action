name: Test summary-output-file feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Disable clang-tidy to speed up the test
          tidy-checks: '-*'
          style: 'llvm'
          extensions: 'c'
          files-changed-only: 'false'
          lines-changed-only: 'false'
          repo-root: '.'
          # Write summary to a file
          summary-output-file: 'cpp-linter-summary.md'
          step-summary: 'false'
          # Disable PR features
          thread-comments: 'false'
          tidy-review: 'false'
          format-review: 'false'
          file-annotations: 'false'
          version: '20'

      - name: Assert summary file was created
        run: |
          echo "Checking for summary output file..."
          if [ -f "cpp-linter-summary.md" ]; then
            echo "PASS: summary output file was created"
            echo "--- File contents ---"
            cat cpp-linter-summary.md
          else
            echo "FAIL: summary output file 'cpp-linter-summary.md' was not created"
            exit 1
          fi

      - name: Assert outputs are set
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
        run: |
          echo "checks-failed: $CHECKS_FAILED"
          if [ -z "$CHECKS_FAILED" ]; then
            echo "FAIL: checks-failed output is empty"
            exit 1
          fi
          echo "PASS: outputs are set"

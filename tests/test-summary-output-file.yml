name: Test summary-output-file feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: linter
        uses: .
        with:
          style: 'llvm'
          extensions: 'c,h'
          tidy-checks: '-*'
          repo-root: '.'
          version: '21'
          verbosity: 'info'
          lines-changed-only: 'false'
          files-changed-only: 'false'
          ignore: '.github|tests/fixtures'
          ignore-tidy: '.github|tests/fixtures'
          ignore-format: '.github|tests/fixtures'
          thread-comments: 'false'
          no-lgtm: 'true'
          step-summary: 'false'
          file-annotations: 'false'
          tidy-review: 'false'
          format-review: 'false'
          passive-reviews: 'false'
          jobs: '1'
          cache-enable: 'false'
          summary-output-file: 'cpp-linter-summary.md'

      - name: Assert summary file was created
        run: |
          echo "Checking for summary output file..."
          if [ ! -f "cpp-linter-summary.md" ]; then
            echo "FAIL: summary output file 'cpp-linter-summary.md' was not created"
            exit 1
          fi
          echo "Summary file contents:"
          cat cpp-linter-summary.md
          echo "PASS: summary output file was created"

      - name: Assert checks-failed output is numeric
        env:
          CHECKS_FAILED: ${{ steps.linter.outputs.checks-failed }}
        run: |
          echo "checks-failed: $CHECKS_FAILED"
          if ! echo "$CHECKS_FAILED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: checks-failed output is not a non-negative integer: '$CHECKS_FAILED'"
            exit 1
          fi
          echo "PASS: checks-failed is numeric"

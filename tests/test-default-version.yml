name: Test with platform default clang version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install clang tools (platform default)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format clang-tidy

      - id: action
        uses: .
        with:
          # Use platform default version (blank string)
          version: ''
          # Disable clang-tidy to speed up the test
          tidy-checks: '-*'
          # Use llvm style for clang-format
          style: 'llvm'
          # Only check C files
          extensions: 'c'
          # Analyze all files (not just changed ones) to avoid GitHub API calls
          files-changed-only: 'false'
          lines-changed-only: 'false'
          # Disable thread comments (requires special permissions)
          thread-comments: 'false'
          # Disable PR reviews
          tidy-review: 'false'
          format-review: 'false'
          # Disable file annotations
          file-annotations: 'false'
          # Disable step summary
          step-summary: 'false'
        continue-on-error: true

      - name: Assert action ran with platform default version
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or install issue)"
            exit 0
          fi

          # If action succeeded, outputs should be numeric
          if [ -z "$CHECKS_FAILED" ]; then
            echo "FAIL: checks-failed output is empty"
            exit 1
          fi
          echo "PASS: action completed with platform default version, checks-failed=$CHECKS_FAILED"

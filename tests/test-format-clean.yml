name: Test clang-format on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          style: llvm
          tidy-checks: '-*'
          repo-root: tests/fixtures/clean
          files-changed-only: 'false'
          lines-changed-only: 'false'
          thread-comments: 'false'
      - name: Assert no checks failed
        env:
          ALL: ${{ steps.action.outputs.checks-failed }}
          FMT: ${{ steps.action.outputs.clang-format-checks-failed }}
          TIDY: ${{ steps.action.outputs.clang-tidy-checks-failed }}
        run: |
          echo "checks-failed: $ALL"
          echo "clang-format-checks-failed: $FMT"
          echo "clang-tidy-checks-failed: $TIDY"
          if [ "$FMT" != "0" ]; then
            echo "FAIL: expected clang-format-checks-failed=0"
            exit 1
          fi
          if [ "$ALL" != "0" ]; then
            echo "FAIL: expected checks-failed=0"
            exit 1
          fi
          echo "PASS"

name: Test clang-format on a clean file - expect zero failures
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: '18'
          tidy-checks: '-*'
          style: 'llvm'
          # Point repo-root at the fixtures directory (relative to GITHUB_WORKSPACE)
          # good.c is already LLVM-formatted; bad.c is excluded via ignore-format
          repo-root: 'tests/fixtures'
          extensions: 'c'
          # Exclude bad.c so only good.c is checked
          ignore: 'bad.c'
          ignore-tidy: 'bad.c'
          ignore-format: 'bad.c'
          files-changed-only: 'false'
          lines-changed-only: 'false'
          thread-comments: 'false'
          file-annotations: 'false'
          step-summary: 'false'
          # Disable caching to avoid cache-related issues under act
          cache-enable: 'false'
        continue-on-error: true

      - name: Assert zero format failures
        env:
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          echo "checks-failed: $CHECKS_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FORMAT_FAILED" ]; then
              echo "FAIL: action succeeded but clang-format-checks-failed output is empty"
              exit 1
            fi
            if [ "$FORMAT_FAILED" != "0" ]; then
              echo "FAIL: expected 0 format failures for good.c, got $FORMAT_FAILED"
              exit 1
            fi
            echo "PASS: zero format failures as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (environment may lack required dependencies)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

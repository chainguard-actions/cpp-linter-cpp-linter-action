name: Test with both linters disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Disable clang-tidy entirely
          tidy-checks: '-*'
          # Disable clang-format entirely
          style: ''
          # Analyze all files (not just changed ones) to avoid GitHub API calls
          files-changed-only: 'false'
          lines-changed-only: 'false'
          # Disable thread comments (requires special permissions)
          thread-comments: 'false'
          # Disable PR reviews
          tidy-review: 'false'
          format-review: 'false'
          # Use version 18 (widely available)
          version: '18'
          # Disable file annotations
          file-annotations: 'false'
          # Disable step summary
          step-summary: 'false'
        continue-on-error: true

      - name: Assert action ran (both linters disabled)
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or install issue)"
            exit 0
          fi

          # When both linters are disabled, checks-failed should be 0
          if [ -z "$CHECKS_FAILED" ]; then
            echo "FAIL: checks-failed output is empty"
            exit 1
          fi
          if [ "$CHECKS_FAILED" != "0" ]; then
            echo "FAIL: expected checks-failed=0 when both linters disabled, got: $CHECKS_FAILED"
            exit 1
          fi
          echo "PASS: checks-failed=0 as expected when both linters are disabled"

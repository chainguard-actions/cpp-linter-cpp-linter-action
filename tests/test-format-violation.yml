name: Test clang-format detects violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          style: llvm
          tidy-checks: '-*'
          repo-root: tests/fixtures/bad
          files-changed-only: 'false'
          thread-comments: 'false'
      - name: Assert format checks failed
        env:
          ALL: ${{ steps.action.outputs.checks-failed }}
          FMT: ${{ steps.action.outputs.clang-format-checks-failed }}
          TIDY: ${{ steps.action.outputs.clang-tidy-checks-failed }}
        run: |
          echo "checks-failed: $ALL"
          echo "clang-format-checks-failed: $FMT"
          echo "clang-tidy-checks-failed: $TIDY"
          case "$FMT" in ''|*[!0-9]*) echo "FAIL: clang-format-checks-failed not an integer"; exit 1;; esac
          case "$ALL" in ''|*[!0-9]*) echo "FAIL: checks-failed not an integer"; exit 1;; esac
          if [ "$FMT" -lt 1 ]; then
            echo "FAIL: expected clang-format-checks-failed >= 1"
            exit 1
          fi
          if [ "$ALL" -lt 1 ]; then
            echo "FAIL: expected checks-failed >= 1"
            exit 1
          fi
          if [ "$TIDY" != "0" ]; then
            echo "FAIL: expected clang-tidy-checks-failed=0 with tidy disabled"
            exit 1
          fi
          echo "PASS"

name: Test format-only (clang-tidy disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a C file with formatting issues
        run: |
          mkdir -p /tmp/test-fmt
          cat > /tmp/test-fmt/bad_format.c << 'EOF'
          #include <stdio.h>
          int main(){int x=1;printf("Hello\n");return 0;}
          EOF

      - id: action
        uses: .
        with:
          style: 'llvm'
          extensions: 'c'
          tidy-checks: '-*'
          repo-root: '/tmp/test-fmt'
          version: '18'
          verbosity: 'info'
          lines-changed-only: 'false'
          files-changed-only: 'false'
          ignore: ''
          thread-comments: 'false'
          no-lgtm: 'true'
          step-summary: 'false'
          file-annotations: 'false'
        continue-on-error: true

      - name: Assert format-only outputs
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            # clang-tidy is disabled so tidy-checks-failed should be 0
            if [ -z "$TIDY_FAILED" ]; then
              echo "FAIL: clang-tidy-checks-failed output is empty"
              exit 1
            fi
            if [ "$TIDY_FAILED" != "0" ]; then
              echo "FAIL: expected clang-tidy-checks-failed=0 (tidy disabled), got '$TIDY_FAILED'"
              exit 1
            fi
            # format output should be set
            if [ -z "$FORMAT_FAILED" ]; then
              echo "FAIL: clang-format-checks-failed output is empty"
              exit 1
            fi
            echo "PASS: tidy disabled (tidy-failed=0), format-failed=$FORMAT_FAILED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or tool install issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

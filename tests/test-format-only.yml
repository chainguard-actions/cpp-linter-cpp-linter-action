name: Test clang-format only (tidy disabled)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Disable clang-tidy, enable clang-format with llvm style
          tidy-checks: '-*'
          style: 'llvm'
          extensions: 'c,h,cpp,hpp'
          repo-root: '.'
          version: '20'
          verbosity: 'info'
          lines-changed-only: 'false'
          files-changed-only: 'false'
          ignore: '.github'
          thread-comments: 'false'
          no-lgtm: 'true'
          step-summary: 'false'
          file-annotations: 'true'
          cache-enable: 'false'

      - name: Assert checks-failed is a number
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
        run: |
          echo "checks-failed: $CHECKS_FAILED"
          if ! echo "$CHECKS_FAILED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected checks-failed to be a non-negative integer, got: '$CHECKS_FAILED'"
            exit 1
          fi
          echo "PASS: checks-failed=$CHECKS_FAILED"

      - name: Assert clang-tidy-checks-failed is zero (tidy disabled)
        env:
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
        run: |
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$TIDY_FAILED" != "0" ]; then
            echo "FAIL: expected clang-tidy-checks-failed to be 0 (tidy disabled), got: '$TIDY_FAILED'"
            exit 1
          fi
          echo "PASS: clang-tidy-checks-failed=0 as expected"

      - name: Assert clang-format-checks-failed is a number
        env:
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
        run: |
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          if ! echo "$FORMAT_FAILED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected clang-format-checks-failed to be a non-negative integer, got: '$FORMAT_FAILED'"
            exit 1
          fi
          echo "PASS: clang-format-checks-failed=$FORMAT_FAILED"

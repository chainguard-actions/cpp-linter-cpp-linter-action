name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple C file to lint
        run: |
          mkdir -p /tmp/test-src
          cat > /tmp/test-src/hello.c << 'EOF'
          #include <stdio.h>
          int main() {
            int x=1;
            printf("Hello, World!\n");
            return 0;
          }
          EOF

      - id: action
        uses: .
        with:
          style: 'llvm'
          extensions: 'c,h'
          tidy-checks: '-*'
          repo-root: '/tmp/test-src'
          version: '18'
          verbosity: 'info'
          lines-changed-only: 'false'
          files-changed-only: 'false'
          ignore: ''
          thread-comments: 'false'
          no-lgtm: 'true'
          step-summary: 'false'
          file-annotations: 'false'
        continue-on-error: true

      - name: Assert outputs are set
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            # Outputs should be integers (0 or more)
            if [ -z "$CHECKS_FAILED" ]; then
              echo "FAIL: checks-failed output is empty"
              exit 1
            fi
            if [ -z "$FORMAT_FAILED" ]; then
              echo "FAIL: clang-format-checks-failed output is empty"
              exit 1
            fi
            if [ -z "$TIDY_FAILED" ]; then
              echo "FAIL: clang-tidy-checks-failed output is empty"
              exit 1
            fi
            echo "PASS: all outputs are set (checks-failed=$CHECKS_FAILED, format=$FORMAT_FAILED, tidy=$TIDY_FAILED)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or tool install issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test basic usage - format only on fixture files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Use version 18 (available in Ubuntu 24.04) or 14 (Ubuntu 22.04)
          version: '18'
          # Only check format (disable tidy to speed up the test)
          tidy-checks: '-*'
          style: 'llvm'
          # Point repo-root at the fixtures directory (relative to GITHUB_WORKSPACE)
          repo-root: 'tests/fixtures'
          extensions: 'c'
          # Use a non-matching ignore pattern (fixtures dir has no .github)
          ignore: '.github'
          ignore-tidy: '.github'
          ignore-format: '.github'
          files-changed-only: 'false'
          lines-changed-only: 'false'
          thread-comments: 'false'
          file-annotations: 'false'
          step-summary: 'false'
          # Disable caching to avoid cache-related issues under act
          cache-enable: 'false'
        continue-on-error: true

      - name: Assert outputs are present or action failed gracefully
        env:
          CHECKS_FAILED: ${{ steps.action.outputs.checks-failed }}
          TIDY_FAILED: ${{ steps.action.outputs.clang-tidy-checks-failed }}
          FORMAT_FAILED: ${{ steps.action.outputs.clang-format-checks-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "checks-failed: $CHECKS_FAILED"
          echo "clang-tidy-checks-failed: $TIDY_FAILED"
          echo "clang-format-checks-failed: $FORMAT_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            # Outputs should be set (numeric values)
            if [ -z "$CHECKS_FAILED" ]; then
              echo "FAIL: action succeeded but checks-failed output is empty"
              exit 1
            fi
            if [ -z "$TIDY_FAILED" ]; then
              echo "FAIL: action succeeded but clang-tidy-checks-failed output is empty"
              exit 1
            fi
            if [ -z "$FORMAT_FAILED" ]; then
              echo "FAIL: action succeeded but clang-format-checks-failed output is empty"
              exit 1
            fi
            echo "PASS: all outputs are set (checks-failed=$CHECKS_FAILED)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (environment may lack required dependencies)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
